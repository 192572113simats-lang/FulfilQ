services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fulfilliq
      POSTGRES_PASSWORD: fulfilliq_dev_password
      POSTGRES_DB: fulfilliq
    ports:
      - '5432:5432'
    volumes:
      - fulfilliq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fulfilliq -d fulfilliq']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DB_DIALECT: postgres
      DATABASE_URL: postgres://fulfilliq:fulfilliq_dev_password@db:5432/fulfilliq
      JWT_SECRET: change-this-in-production
      CORS_ORIGIN: http://localhost:3000,http://localhost:8080
      PAYMENT_GATEWAY_MODE: local_stub
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/ready']
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:80'

volumes:
  fulfilliq_pgdata:
